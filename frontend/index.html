<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seat Map</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Choose Your Seat</h1>

        <p class="subtitle">
            Enter your email address and select an available seat.
        </p>


        <section class="email-section">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
            >

        </section>

        <div class="legend">

            <div class="legend-item">
                <span class="legend-box available"></span>
                Available
            </div>

            <div class="legend-item">
                <span class="legend-box held"></span>
                Held
            </div>

            <div class="legend-item">
                <span class="legend-box confirmed"></span>
                Confirmed
            </div>

        </div>


        <section id="seatMap" class="seat-map">
    
        </section>

        <div class="actions">

            <button id="holdButton">
                Hold Selected Seat
            </button>

            <button id="waitlistButton">
                Join Waitlist
            </button>

        </div>

        <div id="message" class="message"></div>

    </main>


    <script src="script.js"></script>

</body>
</html>
